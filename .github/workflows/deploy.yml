name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      # Publish only the files the app needs (allowlist). Keep in sync with
      # PRECACHE in scripts/sw.template.js; the step fails if one is missing.
      - name: Stage site
        run: |
          mkdir -p _site/dist _site/src _site/icons
          cp index.html manifest.webmanifest sw.js _site/
          cp dist/main.js _site/dist/
          cp src/style.css _site/src/
          cp icons/*.png _site/icons/
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
